[harness]
name = "yoker"
version = "1.0"

[backend]
provider = "ollama"

[backend.ollama]
model = "glm-5.3-flash:cloud"

[context]
storage_path = "./local/context"

[permissions]
filesystem_paths = [ ".", "../yoker", "../c3" ]
blocked_write_paths = [
  "../yoker",
  "Makefile",
  "GNUmakefile",
  "Justfile",
  "Taskfile.yml",
  "pyproject.toml",
  "tox.ini",
  "setup.py",
  "setup.cfg",
  "yoker.toml",
  ".git/config",
  ".git/hooks/*",
  ".github/workflows/*.yml",
  "uv.lock",
  "poetry.lock",
]

[tools]

[tools.list]
enabled = true
max_depth = 5
max_entries = 2000

[tools.update]
enabled = true
require_exact_match = true
max_diff_size_kb = 100

[tools.search]
enabled = true
max_regex_complexity = "medium"
max_results = 500
timeout_ms = 10000

[tools.agent]
enabled = true
timeout_seconds = 300

[tools.mkdir]
enabled = true
max_depth = 20

[tools.existence]
enabled = true

[tools.websearch]
enabled = true
backend = "ollama"
max_results = 10
max_query_length = 500
timeout_seconds = 30
requests_per_minute = 60
requests_per_hour = 1000
block_private_cidrs = true

[tools.webfetch]
enabled = true
backend = "ollama"
timeout_seconds = 30
max_size_kb = 2048
max_redirects = 5
content_type = "markdown"
block_private_cidrs = true
block_metadata_endpoints = true
require_https = true
follow_redirects = true
validate_redirects = true

[tools.skill]
enabled = true

[tools.make]
enabled = true
timeout_ms = 300000
max_output_kb = 100
max_env_var_bytes = 4096

[tools.git]
enabled = true
allowed_commands = ["status", "log", "diff", "branch", "show", "add", "commit", "push", "checkout", "pull", "tag"]
auto_permission = ["status", "log", "diff", "branch", "show", "add", "pull", "tag"]

[tools.github]
enabled = true
allowed_operations = [
  "repo_view", "issue_list", "issue_view", "issue_create",
  "pr_list", "pr_view", "pr_reviews", "pr_comments", "pr_edit", "pr_ready", "pr_comment",
  "workflow_list", "workflow_view",
  "release_list", "release_view",
  "pr_create", "release_create"
]
timeout_ms = 30000
max_results = 100
require_explicit_repo = false
max_output_kb = 100

[tools_shared]

[tools_shared.content_display]
verbosity = "summary"
max_content_lines = 50
max_content_bytes = 4096
show_diff_for_updates = true
max_diff_lines = 30

[agents.directories]
c3 = "../c3/agents"

[skills]
discovery = true

[skills.directories]
c3 = "../c3/skills"

[plugins]
enabled = true  # Whether plugins are enabled globally

[plugins.trusted]
yoker_writing_assistant = true

[logging]
level = "WARNING"
format = "text"
include_tool_calls = true
include_permission_checks = true
timestamp_format_string = "iso"

[ui]
mode = "interactive"  # UI mode ('interactive' or 'batch')
show_thinking = true  # Display thinking output
show_tool_calls = true  # Display tool call information
show_stats = true  # Display turn statistics

[session]
max_agents = 10
default_isolation_policy = "fresh"
event_aggregation = true
